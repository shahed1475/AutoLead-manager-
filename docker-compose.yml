version: "3.9"

# ─── AutoLead Infrastructure ──────────────────────────────────────────────────
# SQLite-only — no external DB/cache services to install or manage. This
# mirrors what actually runs locally, so `docker compose up` and a native
# `uvicorn main:app --reload` behave identically.
#
# Quick start:
#   1. Copy .env.example → .env and fill in secrets
#   2. docker compose --profile full up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    profiles:
      - full     # only starts with: docker compose --profile full up

  # ── Vite frontend (built + served via nginx) ──────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    profiles:
      - full
