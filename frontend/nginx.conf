# Rendered by the nginx image's envsubst step (/etc/nginx/templates) — only
# NGINX_PORT and BACKEND_URL are substituted; nginx's own $vars pass through.
server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Hardening (the app can be shared publicly through ./start.sh) ─────────
    server_tokens off;
    client_max_body_size 25m;          # CSV / XLSX lead imports and attachments
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets never change — cache them for a year. `expires`
    # (not add_header) keeps the security headers above inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app shell must always be fresh so a new deploy shows up at once.
    location = /index.html {
        expires -1;
    }

    # Installable app: the service worker is re-checked on every visit so a
    # new release reaches installed phones/desktops; manifest has its own type.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1h;
    }

    # SPA fallback — client-side routing (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE log stream to the backend container.
    # buffering off + long read timeout keep /api/logs/stream flowing live.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# ── Client link — the one link you share with clients ─────────────────────
# /signin/      the sign-in pages (dist-portal/signin/)
# /api/portal/  sign-in API on YOUR app (codes, profile, "open my dashboard")
# everything else → the signed-in client's OWN workspace. The routing cookie
# (set by /api/portal/workspace/enter) only chooses a workspace port in
# 7001–7099; each workspace still requires its own sign-in, so a forged cookie
# only reaches another workspace's locked door. Your dashboard (this server's
# other port) and your API are never reachable from here.
map $cookie_hom_ws $hom_ws_port {
    "~^(70(0[1-9]|[1-9][0-9]))$" $1;
    default "";
}

server {
    listen ${PORTAL_PORT};
    server_name _;
    root /usr/share/nginx/portal;

    server_tokens off;
    client_max_body_size 25m;          # CSV / XLSX imports inside a workspace
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    location = /signin {
        return 302 /signin/;
    }

    location ^~ /signin/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /signin/ {
        expires -1;
        try_files $uri /signin/index.html;
    }

    location ^~ /api/portal/ {
        proxy_pass ${BACKEND_URL}/api/portal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # The signed-in client's own workspace (its own web server + API).
    location / {
        if ($hom_ws_port = "") {
            return 302 /signin/;
        }
        proxy_pass http://127.0.0.1:$hom_ws_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        error_page 502 503 504 = @workspace_down;
    }

    # Workspace not answering (paused, starting, deleted): back to the sign-in
    # page, which explains what's going on.
    location @workspace_down {
        return 302 /signin/?from=workspace;
    }
}
