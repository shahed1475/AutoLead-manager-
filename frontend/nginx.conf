# Rendered by the nginx image's envsubst step (/etc/nginx/templates) — only
# NGINX_PORT and BACKEND_URL are substituted; nginx's own $vars pass through.
server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Hardening (the app can be shared publicly through ./start.sh) ─────────
    server_tokens off;
    client_max_body_size 25m;          # CSV / XLSX lead imports and attachments
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Hashed build assets never change — cache them for a year. `expires`
    # (not add_header) keeps the security headers above inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The app shell must always be fresh so a new deploy shows up at once.
    location = /index.html {
        expires -1;
    }

    # Installable app: the service worker is re-checked on every visit so a
    # new release reaches installed phones/desktops; manifest has its own type.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires 1h;
    }

    # SPA fallback — client-side routing (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + SSE log stream to the backend container.
    # buffering off + long read timeout keep /api/logs/stream flowing live.
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
