# ─── Host-network override ────────────────────────────────────────────────────
# For Linux hosts where Ollama only listens on 127.0.0.1 (the default systemd
# install), so containers on the bridge network can't reach it. Both services
# share the host's network stack instead:
#   backend  → 127.0.0.1:8000 (loopback only), talks to Ollama on 127.0.0.1
#   frontend → nginx on :${FRONTEND_PORT:-5173}, proxies /api to the backend
#
#   docker compose -f docker-compose.yml -f docker-compose.host.yml --profile full up -d --build
# ──────────────────────────────────────────────────────────────────────────────

services:
  backend:
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
    command: ["uvicorn", "backend.main:app", "--host", "127.0.0.1", "--port", "${BACKEND_PORT:-8000}"]

  frontend:
    network_mode: host
    ports: !reset []
    environment:
      NGINX_PORT:  ${FRONTEND_PORT:-5173}
      BACKEND_URL: http://127.0.0.1:${BACKEND_PORT:-8000}
